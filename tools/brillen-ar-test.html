<html lang="de"><head><meta charset="utf-8"><title>AR-Test (intern)</title>

</head><body><video id="v" playsinline muted></video><canvas id="c"></canvas><div id="s"></div>
<script type="module">
import { Anprobe } from '../assets/js/3d/brillen-ar.js';
const q = new URLSearchParams(location.search);
const a = new Anprobe({ canvas: document.getElementById('c'), video: document.getElementById('v'), onStatus: (t) => (document.getElementById('s').textContent = t) });
