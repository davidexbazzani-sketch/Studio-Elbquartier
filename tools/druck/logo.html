<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Logo – Studio Elbquartier</title>
<!-- Logo-Varianten wie auf Visitenkarte und Website; als PNG gerechnet mit tools/druck/logo-png.mjs -->
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../assets/fonts/instrument-serif-400.woff2) format('woff2'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'Inter'; src: url(../../assets/fonts/inter-latin-wght.woff2) format('woff2'); font-weight: 100 900; font-style: normal; }
html, body { margin: 0; background: transparent; }
.v { display: inline-flex; padding: 60px; color: #1f1c18; }
.v.hell { color: #faf7f2; }
.quer { align-items: center; gap: 44px; }
.quer svg { width: 150px; height: 150px; }
.quer span { font-family: 'Instrument Serif', serif; font-size: 160px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
.gestapelt { flex-direction: column; align-items: center; gap: 70px; }
.gestapelt svg { width: 180px; height: 180px; }
.gestapelt .text { display: flex; flex-direction: column; align-items: center; gap: 62px; }
.gestapelt h1 { margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 180px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
.gestapelt .strich { width: 140px; height: 6px; background: #a88a5f; }
.gestapelt p { margin: 0; font-family: 'Inter', sans-serif; font-size: 52px; font-weight: 500; line-height: 1; letter-spacing: 0.2em; text-transform: uppercase; color: #5d574f; white-space: nowrap; }
.hell.gestapelt p { color: #d9d3c9; }
</style>
</head>
<body>
<template id="zeichen"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 17.5c3.3-2.6 6.7-2.6 10 0s6.7 2.6 10 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M8 21.5c2.7-2 5.3-2 8 0s5.3 2 8 0" fill="none" stroke="#a88a5f" stroke-width="1.2" stroke-linecap="round"/></svg></template>
<div id="quer" class="v quer"><span>Studio Elbquartier</span></div><br>
<div id="quer-hell" class="v quer hell"><span>Studio Elbquartier</span></div><br>
<div id="gestapelt" class="v gestapelt"><div class="text"><h1>Studio Elbquartier</h1><div class="strich"></div><p>Webdesign &amp; Softwarelösungen</p></div></div><br>
<div id="zeichen-name" class="v gestapelt"><div class="text"><h1>Studio Elbquartier</h1></div></div><br>
<div id="zeichen-name-weiss" class="v gestapelt" style="background:#ffffff"><div class="text"><h1>Studio Elbquartier</h1></div></div><br>
<div id="zeichen-name-hell" class="v gestapelt hell"><div class="text"><h1>Studio Elbquartier</h1></div></div><br>
<div id="gestapelt-hell" class="v gestapelt hell"><div class="text"><h1>Studio Elbquartier</h1><div class="strich"></div><p>Webdesign &amp; Softwarelösungen</p></div></div>
<script>
for (const v of document.querySelectorAll('.v')) v.prepend(document.getElementById('zeichen').content.cloneNode(true));
</script>
</body>
</html>
