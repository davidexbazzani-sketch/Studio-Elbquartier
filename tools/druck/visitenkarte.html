<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Visitenkarte – Druckdaten</title>
<!-- Druckvorlage der Visitenkarte, gleicher Entwurf wie im Design-Artifact.
     Endformat 85 × 55 mm, Beschnitt rundum über --b (Standard 3 mm → Datenformat 91 × 61 mm; Flyeralarm will 1 mm → 87 × 57 mm).
     Alles ist auf das Endformat (.endformat) bezogen, damit Inhalte bei jedem Beschnitt an derselben Stelle der fertigen Karte sitzen.
     Seite 1 Vorderseite, Seite 2 Rückseite. PDF erzeugen: python3 tools/druck/visitenkarte-pdf.py
     Für den Druck sind die Farbverläufe der Wellen deckend angelegt (Hintergrundfarbe statt Transparenz). -->
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../assets/fonts/instrument-serif-400.woff2) format('woff2'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'Inter'; src: url(../../assets/fonts/inter-latin-wght.woff2) format('woff2'); font-weight: 100 900; font-style: normal; }
:root { --b: 3mm; }
@page { size: 91mm 61mm; margin: 0; }
html, body { margin: 0; padding: 0; }
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.seite { position: relative; width: calc(85mm + 2 * var(--b)); height: calc(55mm + 2 * var(--b)); overflow: hidden; box-sizing: border-box; padding: var(--b); color: #1f1c18; font-family: 'Inter', sans-serif; break-after: page; }
.seite:last-child { break-after: auto; }
/* Endformat; der Innenabstand entspricht den 27 px des Entwurfs abzüglich 3 mm Beschnitt */
.endformat { position: relative; width: 85mm; height: 55mm; box-sizing: border-box; padding: 15.66px; }
</style>
</head>
<body>
<!-- VORNE -->
<div class="seite" style="background: #faf7f2">
<div class="endformat" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" style="display: block; flex: none">
<circle cx="16" cy="16" r="15" fill="none" stroke="#1f1c18" stroke-width="1.1"/>
<path d="M6 17.5c3.3-2.6 6.7-2.6 10 0s6.7 2.6 10 0" fill="none" stroke="#1f1c18" stroke-width="1.1" stroke-linecap="round"/>
<path d="M8 21.5c2.7-2 5.3-2 8 0s5.3 2 8 0" fill="none" stroke="#a88a5f" stroke-width="1.1" stroke-linecap="round"/>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 11px">
<h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap">Studio Elbquartier</h1>
<div style="width: 24px; height: 1px; background: #a88a5f"></div>
<p style="margin: 0; font-size: 9px; font-weight: 500; line-height: 1; letter-spacing: 0.2em; text-transform: uppercase; color: #5d574f; white-space: nowrap">Webdesign &amp; Softwarelösungen</p>
</div>
</div>
</div>
<!-- /VORNE -->
<!-- HINTEN -->
<div class="seite" style="background: #dbe3e7">
<div class="endformat" style="display: flex; flex-direction: column; justify-content: space-between">
<!-- Lage wie im Entwurf: 74 px von oben und 14 px über den rechten Rand des 91-mm-Formats, hier auf das Endformat umgerechnet -->
<svg viewBox="0 0 240 40" aria-hidden="true" style="position: absolute; top: 62.66px; right: -25.34px; width: 230px; height: 38px; display: block">
<defs>
<!-- deckend: von der Hintergrundfarbe zur Linienfarbe (entspricht 0 → 55 % Tinte bzw. 0 → 100 % Sand) -->
<linearGradient id="welle-tinte" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#dbe3e7"/>
<stop offset="0.5" stop-color="#767675"/>
</linearGradient>
<linearGradient id="welle-sand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#dbe3e7"/>
<stop offset="0.5" stop-color="#a88a5f"/>
</linearGradient>
</defs>
<path d="M0 16c6.6-5.2 13.4-5.2 20 0s13.4 5.2 20 0s13.4-5.2 20 0s13.4 5.2 20 0s13.4-5.2 20 0s13.4 5.2 20 0s13.4-5.2 20 0s13.4 5.2 20 0s13.4-5.2 20 0s13.4 5.2 20 0s13.4-5.2 20 0s13.4 5.2 20 0" fill="none" stroke="url(#welle-tinte)" stroke-width="1.1" stroke-linecap="round"/>
<path d="M4 24c5.4-4 10.6-4 16 0s10.6 4 16 0s10.6-4 16 0s10.6 4 16 0s10.6-4 16 0s10.6 4 16 0s10.6-4 16 0s10.6 4 16 0s10.6-4 16 0s10.6 4 16 0s10.6-4 16 0s10.6 4 16 0s10.6-4 16 0s10.6 4 16 0" fill="none" stroke="url(#welle-sand)" stroke-width="1.1" stroke-linecap="round"/>
</svg>
<div style="position: relative; display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true" style="display: block; flex: none">
<circle cx="16" cy="16" r="15" fill="none" stroke="#1f1c18" stroke-width="1.4"/>
<path d="M6 17.5c3.3-2.6 6.7-2.6 10 0s6.7 2.6 10 0" fill="none" stroke="#1f1c18" stroke-width="1.4" stroke-linecap="round"/>
<path d="M8 21.5c2.7-2 5.3-2 8 0s5.3 2 8 0" fill="none" stroke="#a88a5f" stroke-width="1.4" stroke-linecap="round"/>
</svg>
<span style="font-family: 'Instrument Serif', serif; font-size: 15px; line-height: 1; white-space: nowrap">Studio Elbquartier</span>
</div>
<div style="position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr); column-gap: 8px; row-gap: 7px; align-items: baseline">
<span style="font-size: 8px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #5d574f">Web</span>
<span style="font-size: 11px; line-height: 1.2; white-space: nowrap">studio-elbquartier.de</span>
<span style="font-size: 8px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #5d574f">E-Mail</span>
<span style="font-size: 11px; line-height: 1.2; white-space: nowrap">hallo@studio-elbquartier.de</span>
<span style="font-size: 8px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #5d574f">Mobil</span>
<span style="font-size: 11px; line-height: 1.2; white-space: nowrap">0176 31685816</span>
</div>
</div>
</div>
<!-- /HINTEN -->
</body>
</html>
